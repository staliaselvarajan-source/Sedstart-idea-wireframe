<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sedstart homepage – draft v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap">
<style>
body{margin:0;background:#F6F7F6}
a{color:#18181B}a:hover{color:#52525B}
.flow path{stroke-dasharray:6 12;animation:sedflow 1.4s linear infinite}
@keyframes sedflow{to{stroke-dashoffset:-36}}
@media (prefers-reduced-motion: reduce){.flow path{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="font-family: 'Instrument Sans', system-ui, sans-serif; color: #18181B; background: #F6F7F6; width: 100%">

<!-- NAV -->
<header style="max-width: 1240px; margin: 0 auto; padding: 22px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 22px"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 6px; background: #8B5CF6; display: inline-block"></span>Sedstart</div>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 28px; font-size: 16px"><a href="#" style="text-decoration: none">Product</a><a href="#" style="text-decoration: none">Solutions</a><a href="#" style="text-decoration: none">Services</a><a href="#" style="text-decoration: none">Resources</a></nav>
<div style="display: flex; gap: 12px; align-items: center"><a href="#" style="text-decoration: none; padding: 12px 8px">Log in</a><a href="#" style="text-decoration: none; border: 1px solid #A1A1AA; padding: 11px 18px; border-radius: 12px">Start free trial</a><a href="#" style="text-decoration: none; background: #18181B; color: #FFFFFF; padding: 12px 20px; border-radius: 12px; font-weight: 500">Book a demo</a></div>
</header>

<!-- 1 HERO: as in the current wireframe -->
<section style="max-width: 1240px; margin: 0 auto; padding: 56px 32px 64px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
<div style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 26px">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 96px; line-height: 0.98; letter-spacing: -0.02em">Test <span style="color: #2DD4BF">everything.</span><br>Write nothing.</h1>
<p style="margin: 0; font-size: 21px; line-height: 1.55; color: #3F3F46; max-width: 600px">No-code test automation for <b>web, mobile and API</b>. Your testers build tests from visual blocks, with loops, variables and reuse built in.</p>
<div style="max-width: 600px; display: flex; flex-direction: column">
<div role="tablist" aria-label="Get started" style="display: flex; gap: 4px; padding-left: 20px">
<button type="button" role="tab" onClick="{{ heroTrial }}" style="{{ trialTab }}">Start free trial <span style="background: #CCFBF1; color: #115E59; border-radius: 8px; padding: 3px 8px; font-size: 14px; margin-left: 6px">14 days</span></button>
<button type="button" role="tab" onClick="{{ heroDemo }}" style="{{ demoTab }}">Book a demo</button></div>
<div style="background: #EFE6F3; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 10px; background: #FFFFFF; border-radius: 16px; padding: 8px 8px 8px 18px; align-items: center">
<span aria-hidden="true" style="color: #A21CAF; font-size: 18px">✉</span>
<label for="v2-email" style="position: absolute; left: -9999px">Your work email</label>
<input id="v2-email" type="email" placeholder="Your work email" style="flex: 1; border: 0; font-size: 18px; font-family: inherit; padding: 12px 0; outline: none; min-width: 0">
<button type="button" aria-label="{{ heroCta }}" style="background: #18181B; color: #FFFFFF; border: 0; border-radius: 12px; width: 60px; height: 52px; font-size: 22px">→</button></div>
<div style="display: flex; flex-wrap: wrap; gap: 20px; font-size: 16px; color: #3F3F46; padding: 0 8px 4px">
<span><span style="color: #A21CAF">✓</span> {{ heroCheck1 }}</span><span><span style="color: #A21CAF">✓</span> {{ heroCheck2 }}</span></div>
</div></div>
</div>
<div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 24px; align-items: center">
<div aria-hidden="true" style="width: 100%; height: 400px; position: relative">
<div style="position: absolute; left: 50%; top: 52%; width: 300px; height: 300px; transform: translate(-50%, -50%) rotate(45deg) scaleY(0.58); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0">
<span style="background: #E9D5FF"></span><span style="background: #DDD6FE"></span><span style="background: #C7D2FE"></span><span style="background: #BAE6FD"></span>
<span style="background: #F5D0FE"></span><span style="background: #E9D5FF"></span><span style="background: #99F6E4"></span><span style="background: #C7D2FE"></span>
<span style="background: #FBCFE8"></span><span style="background: #F5D0FE"></span><span style="background: #E9D5FF"></span><span style="background: #DDD6FE"></span>
<span style="background: #FED7AA"></span><span style="background: #FBCFE8"></span><span style="background: #F5D0FE"></span><span style="background: #FDE68A"></span></div>
<div style="position: absolute; left: 30%; top: 22%; width: 110px; height: 110px; background: #FFFFFF; border-radius: 10px; box-shadow: 0 20px 40px rgba(24,24,27,0.12)"></div>
<div style="position: absolute; left: 55%; top: 8%; width: 110px; height: 110px; background: #FDF2F8; border-radius: 10px; box-shadow: 0 20px 40px rgba(24,24,27,0.10)"></div></div>
<div style="display: flex; align-items: center; gap: 16px; font-size: 17px; width: 100%; max-width: 460px">
<b>Regression suite</b><span style="flex: 1; height: 3px; border-radius: 2px; background: #2DD4BF"></span><span><b>16</b> of 16 passed</span></div>
</div>
</section>

<!-- 2 TRUSTED BY: logos -->
<section style="padding: 8px 32px 56px">
<div style="max-width: 1176px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; align-items: center">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #52525B">Trusted by QA teams at</div>
<div style="width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; font-weight: 700; font-size: 24px; color: #3F3F46"><span>tuneCORE</span><span>ENPHASE</span><span>pricebook</span><span>ClinicalMind</span><span>REWA</span><span>iLiFE</span></div>
</div>
</section>

<!-- 3 CUSTOMER STORIES: horizontal blocks -->
<section style="padding: 32px 32px 96px">
<div style="max-width: 1176px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 52px; line-height: 1.05">Customer stories</h2>
<a href="#case-study" style="font-weight: 500">All stories →</a></div>
<div style="display: flex; gap: 20px; overflow-x: auto; padding-bottom: 8px">
<sc-for list="{{ stories }}" as="s" hint-placeholder-count="4">
<div style="{{ s.style }}">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="border: 1px dashed currentColor; border-radius: 10px; padding: 8px 12px; font-size: 13px; opacity: 0.8">{{ s.logo }}</span><span style="font-size: 13px; font-weight: 600">{{ s.tag }}</span></div>
<div style="font-family: 'Newsreader', Georgia, serif; font-size: 64px; line-height: 1">{{ s.stat }}</div>
<p style="margin: 0; font-size: 17px; line-height: 1.5">{{ s.text }}</p>
<a href="#" style="margin-top: auto; font-weight: 600; color: inherit">Read story →</a></div>
</sc-for></div>
</div>
</section>

<!-- 4 PROBLEM -->
<section style="background: #ECEEEC; padding: 96px 32px">
<div style="max-width: 1176px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 12px"><div style="font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #6D28D9; font-weight: 600">The problem</div>
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 60px; line-height: 1.02; letter-spacing: -0.015em; max-width: 720px">No-code made testing easy. It also made it weak.</h2></div>
<div role="group" aria-label="Compare" style="display: flex; background: #FFFFFF; border-radius: 999px; padding: 6px; gap: 4px; border: 1px solid #D4D4D8">
<button type="button" onClick="{{ showScripted }}" style="{{ scriptedBtn }}">Scripted</button>
<button type="button" onClick="{{ showSedstart }}" style="{{ sedstartBtn }}">Sedstart</button></div></div>
<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: stretch">
<div style="flex: 1 1 560px; min-width: 0; background: #FFFFFF; border-radius: 24px; border: 1px solid #E4E4E7; overflow: hidden">
<sc-if value="{{ isScripted }}" hint-placeholder-val="{{ true }}">
<div style="padding: 16px 24px; border-bottom: 1px solid #E4E4E7; font-size: 14px; color: #52525B">checkout.spec.ts</div>
<div style="padding: 24px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; line-height: 2.1; color: #6D28D9">
<div>await page.goto('/login');</div><div>await page.fill('#email', user.email);</div><div>await page.click('div &gt; .btn:nth-child(3)');</div><div>await page.waitForSelector('.nav-item');</div><div>const total = await page.textContent('#total');</div></div>
</sc-if>
<sc-if value="{{ isSedstart }}" hint-placeholder-val="{{ false }}">
<div style="padding: 16px 24px; border-bottom: 1px solid #E4E4E7; font-size: 14px; color: #52525B">Checkout flow · visual blocks</div>
<div style="padding: 24px; display: flex; flex-direction: column; gap: 10px; font-size: 16px">
<div style="display: flex; gap: 8px; align-items: center; background: #F4F4F5; border-radius: 12px; padding: 10px 14px"><b>Open</b> page <span style="background: #FFFFFF; padding: 4px 10px; border-radius: 8px">/login</span></div>
<div style="display: flex; gap: 8px; align-items: center; background: #F4F4F5; border-radius: 12px; padding: 10px 14px"><b>Type</b> user email into <span style="background: #D1FAE5; color: #065F46; padding: 4px 10px; border-radius: 8px">EmailField</span></div>
<div style="display: flex; gap: 8px; align-items: center; background: #F4F4F5; border-radius: 12px; padding: 10px 14px"><b>Click</b> on <span style="background: #F3E8FF; color: #6B21A8; padding: 4px 10px; border-radius: 8px">LoginBtn</span></div>
<div style="display: flex; gap: 8px; align-items: center; background: #F4F4F5; border-radius: 12px; padding: 10px 14px"><b>Check</b> <span style="background: #FEF3C7; color: #78350F; padding: 4px 10px; border-radius: 8px">Total</span> is shown</div></div>
</sc-if></div>
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px">
<p style="margin: 0; font-size: 22px; line-height: 1.45">Coded tools are powerful but only engineers can use them. Most no-code tools are easy but too limited for real apps.</p>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 17px; line-height: 1.5; color: #3F3F46">
<li>Only engineers can write and fix coded tests</li><li>Every UI change breaks tests for the wrong reasons</li><li>Most no-code tools have no loops, variables or reuse</li><li>Big suites take hours or days to run</li></ul></div>
</div></div>
</section>

<!-- 5 SOLUTION: two-product switch (Intercom) + how-it-works stepper (Testsigma) -->
<section style="padding: 96px 32px 72px">
<div style="max-width: 1176px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center">
<div style="font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #6D28D9; font-weight: 600">The solution</div>
<h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 60px; line-height: 1.05; letter-spacing: -0.015em">Two ways to fix it. One partner.</h2></div>
<div role="group" aria-label="What we offer" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<button type="button" onClick="{{ showPlatform }}" style="{{ platformCard }}"><span style="font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75">Do it yourself</span><span style="font-size: 28px; font-weight: 600">Sedstart platform</span><span style="font-size: 16px; opacity: 0.85">Your team builds and runs tests without code</span></button>
<button type="button" onClick="{{ showServices }}" style="{{ servicesCard }}"><span style="font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75">Done for you</span><span style="font-size: 28px; font-weight: 600">QA services</span><span style="font-size: 16px; opacity: 0.85">Our QA engineers test it for you</span></button>
</div>

<sc-if value="{{ isPlatform }}" hint-placeholder-val="{{ true }}">
<div style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 24px">
<div style="font-size: 15px; font-weight: 600; color: #52525B">How it works</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
<button type="button" onClick="{{ s.pick }}" style="{{ s.card }}">
<span style="display: flex; align-items: center; gap: 10px; width: 100%"><span style="{{ s.circle }}">{{ s.num }}</span><span style="{{ s.hline }}"></span></span>
<span style="{{ s.labelStyle }}">{{ s.title }}</span>
<span style="font-size: 14px; color: #52525B">{{ s.hint }}</span></button>
</sc-for></div>
<div style="{{ stepPanel }}">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px; justify-content: center">
<h3 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 38px">{{ cur.title }}</h3>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #3F3F46">{{ cur.body }}</p></div>
<div style="flex: 1 1 440px; min-width: 0; background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center"><b style="font-size: 18px">{{ cur.panelTitle }}</b><span style="font-size: 14px; color: #52525B">{{ cur.panelTag }}</span></div>
<sc-for list="{{ cur.rows }}" as="row" hint-placeholder-count="4"><div style="background: #F4F4F5; border-radius: 10px; padding: 11px 14px; display: flex; justify-content: space-between; gap: 12px"><span>{{ row.a }}</span><span style="color: #52525B">{{ row.b }}</span></div></sc-for>
</div></div>

<div style="border-top: 1px solid #E4E4E7; padding-top: 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 32px">What makes it work</span><a href="#product" style="font-weight: 500">See all features →</a></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{ keyFeats }}" as="k" hint-placeholder-count="4">
<a href="{{ k.href }}" style="{{ k.style }}">
<span aria-hidden="true" style="{{ k.visual }}">{{ k.glyph }}</span>
<b style="font-size: 19px">{{ k.name }}</b>
<span style="font-size: 15px; line-height: 1.45; color: #3F3F46">{{ k.line }}</span>
<span style="margin-top: auto; font-size: 15px; font-weight: 600">Learn more →</span></a>
</sc-for></div>
</div>
</div>
</sc-if>

<sc-if value="{{ isServices }}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 24px">
<div style="font-size: 15px; font-weight: 600; color: #52525B">How it works</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ svcSteps }}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{ p.pick }}" style="{{ p.card }}">
<span style="display: flex; align-items: center; gap: 10px; width: 100%"><span style="{{ p.circle }}">{{ p.num }}</span><span style="{{ p.hline }}"></span></span>
<span style="{{ p.labelStyle }}">{{ p.title }}</span>
<span style="font-size: 14px; color: #52525B">{{ p.hint }}</span></button>
</sc-for></div>
<div style="display: flex; flex-wrap: wrap; gap: 32px; border-radius: 22px; padding: 32px; background: #EDE9FE">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px; justify-content: center">
<h3 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 38px">{{ sp.title }}</h3>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #3F3F46">{{ sp.body }}</p></div>
<div style="flex: 1 1 440px; min-width: 0; background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<b style="font-size: 18px">{{ sp.panelTitle }}</b>
<sc-for list="{{ sp.rows }}" as="row" hint-placeholder-count="4"><div style="background: #F4F4F5; border-radius: 10px; padding: 11px 14px; display: flex; justify-content: space-between; gap: 12px"><span>{{ row.a }}</span><span style="color: #52525B">{{ row.b }}</span></div></sc-for>
</div></div>

<div style="border-top: 1px solid #E4E4E7; padding-top: 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 32px">Ways to work with us</span><a href="#qa-services" style="font-weight: 500">Explore QA services →</a></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{ svcs }}" as="v" hint-placeholder-count="4">
<a href="#qa-services" style="{{ v.style }}">
<span aria-hidden="true" style="{{ v.visual }}">{{ v.glyph }}</span>
<b style="font-size: 19px">{{ v.title }}</b>
<span style="font-size: 15px; line-height: 1.45; color: #3F3F46">{{ v.body }}</span>
<span style="margin-top: auto; font-size: 15px; font-weight: 600">Learn more →</span></a>
</sc-for></div>
</div>
</div>
</sc-if>
</div>
</section>

<!-- 6 INTEGRATIONS with category tabs (Testsigma) -->
<section style="padding: 0 32px 72px">
<div style="max-width: 1176px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 28px; padding: 48px 40px; display: flex; flex-direction: column; gap: 32px; align-items: center; text-align: center">
<div style="display: flex; flex-direction: column; gap: 12px; align-items: center">
<div style="font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: #6D28D9; font-weight: 600">Integrations</div>
<h3 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 48px; line-height: 1.08">Works with the tools you already use</h3>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #3F3F46; max-width: 640px">Sedstart sits in the middle: it takes triggers from your pipeline, tests the apps you run, and sends results back to your team.</p></div>
<div style="width: 100%; overflow-x: auto">
<div style="position: relative; width: 1096px; height: 500px; margin: 0 auto; text-align: left; background-image: radial-gradient(#E4E4E7 1px, transparent 1px); background-size: 22px 22px">
<svg aria-hidden="true" width="1096" height="500" viewBox="0 0 1096 500" style="position: absolute; left: 0; top: 0">
<g fill="none" stroke="#E4E4E7" stroke-width="2">
<path d="M240 64 C 344 64, 344 252, 448 252"></path><path d="M240 139 C 344 139, 344 252, 448 252"></path><path d="M240 214 C 344 214, 344 252, 448 252"></path><path d="M240 289 C 344 289, 344 252, 448 252"></path><path d="M240 364 C 344 364, 344 252, 448 252"></path><path d="M240 439 C 344 439, 344 252, 448 252"></path>
<path d="M648 252 C 752 252, 752 64, 856 64"></path><path d="M648 252 C 752 252, 752 139, 856 139"></path><path d="M648 252 C 752 252, 752 214, 856 214"></path><path d="M648 252 C 752 252, 752 289, 856 289"></path><path d="M648 252 C 752 252, 752 364, 856 364"></path><path d="M648 252 C 752 252, 752 439, 856 439"></path></g>
<g fill="none" stroke-width="2.5" stroke-linecap="round" class="flow">
<path stroke="#2DD4BF" d="M240 64 C 344 64, 344 252, 448 252"></path><path stroke="#2DD4BF" d="M240 139 C 344 139, 344 252, 448 252"></path><path stroke="#2DD4BF" d="M240 214 C 344 214, 344 252, 448 252"></path><path stroke="#A855F7" d="M240 289 C 344 289, 344 252, 448 252"></path><path stroke="#A855F7" d="M240 364 C 344 364, 344 252, 448 252"></path><path stroke="#A855F7" d="M240 439 C 344 439, 344 252, 448 252"></path>
<path stroke="#F59E0B" d="M648 252 C 752 252, 752 64, 856 64"></path><path stroke="#F59E0B" d="M648 252 C 752 252, 752 139, 856 139"></path><path stroke="#F59E0B" d="M648 252 C 752 252, 752 214, 856 214"></path><path stroke="#F59E0B" d="M648 252 C 752 252, 752 289, 856 289"></path><path stroke="#3B82F6" d="M648 252 C 752 252, 752 364, 856 364"></path><path stroke="#3B82F6" d="M648 252 C 752 252, 752 439, 856 439"></path></g>
</svg>
<div style="position: absolute; left: 24px; top: 4px; font-size: 13px; font-weight: 600; color: #52525B; letter-spacing: 0.04em; text-transform: uppercase">Your pipeline and team</div>

function resolve(scope, path){
